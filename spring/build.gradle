plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter:4.0.0'
}

application {
    mainClass = 'com.yeonseong.springexample.SpringExampleApplication'
}
